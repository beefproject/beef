# BeEF label definitions — source of truth for label sync.
#
# Component/area retention policy: keep if used in last 3 years OR maps to live code OR a supported deployment target (e.g. Kali). Else delete.
# Automation-locked (do not rename): 'Stale' (stale issues), 'no-pr-activity' (stale PRs) [stale.yml]; 'safe_to_test' [github_actions.yml]; 'dependencies' [Dependabot].
#
- name: "Autorun Rules Engine"
  color: "0b02e1"
  description: "Autorun Rule Engine (ARE) for auto-running modules on hooked browsers"
- name: "Backlog"
  color: "d3d3d3"
  description: "Deferred for future work"
- name: "Core"
  color: "0b02e1"
  description: "BeEF core framework (incl. WebSocket C&C channel and database layer)"
- name: "Critical"
  color: "e10c02"
  description: "Critical severity"
